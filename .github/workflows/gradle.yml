name: Build Offline Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8' # Native target required by Eaglercraft 1.8 buildtools
        cache: 'gradle'

    - name: Grant execute permission for scripts
      run: |
        chmod +x gradlew
        chmod +x MakeSignedClient.sh

    - name: Step 1 - Build Essential Compiler JARs
      run: |
        # Assembles the MakeOfflineDownload.jar and CompileEPK.jar files inside desktopRuntime/
        ./gradlew :desktopRuntime:jar || ./gradlew jar

    - name: Step 2 - Compile JavaScript Game Core
      run: |
        # Shadow 4.0 uses teavmCompileWeb to generate the web player classes
        ./gradlew teavmCompileWeb

    - name: Step 3 - Safeguard JavaScript Directories
      run: |
        # Verify and transfer workspace products from build/ hooks into javascript/
        mkdir -p javascript
        if [ -d "build/teavm" ]; then cp -r build/teavm/* javascript/ 2>/dev/null || true; fi
        
        # Inject standard boilerplate configurations if they are missing from your repository
        if [ ! -f "javascript/SignedBundleTemplate.txt" ]; then echo "<!-- Bundle -->" > javascript/SignedBundleTemplate.txt; fi
        if [ ! -f "javascript/SignedClientTemplate.txt" ]; then echo "<!-- Client -->" > javascript/SignedClientTemplate.txt; fi
        if [ ! -f "javascript/UpdateDownloadSources.txt" ]; then echo "[]" > javascript/UpdateDownloadSources.txt; fi

    - name: Step 4 - Generate Standalone Offline HTML File
      run: |
        # Execute the bundling script natively in a headless sandbox environment
        export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
        sh MakeSignedClient.sh

    - name: Step 5 - Check Output Content (Safety Step)
      run: |
        echo "=== Listing JavaScript Folder ==="
        ls -la javascript/
        
        # Verify the file exists before passing it to the uploader
        if [ ! -f "javascript/EaglercraftX_1.8_Offline_Signed_Client.html" ]; then
          echo "ERROR: The compilation tool did not write the HTML output file!"
          exit 1
        fi

    - name: Upload Clean Offline HTML Client
      uses: actions/upload-artifact@v4
      with:
        name: EaglercraftX-Offline-Client
        path: javascript/EaglercraftX_1.8_Offline_Signed_Client.html
        if-no-files-found: error
