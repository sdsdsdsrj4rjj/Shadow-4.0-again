name: Build Offline Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8' # Ensures best native compatibility with Eaglercraft 1.8 build structures
        cache: 'gradle'

    - name: Grant execute permission for scripts
      run: |
        chmod +x gradlew
        chmod +x MakeSignedClient.sh

    - name: Step 1 - Build Project and Core WebAssembly
      run: |
        ./gradlew clean compileJava teavmCompileAll build -x test || ./gradlew teavmCompileAll || true

    - name: Step 2 - Sync Web Assets Into Target Location
      run: |
        mkdir -p javascript
        # Move actual client assets from TeaVM hooks into workspace bundler directory
        if [ -d "build/teavm" ] && [ "$(ls -A build/teavm)" ]; then cp -r build/teavm/* javascript/ 2>/dev/null || true; fi
        if [ -d "stable-download/teavm" ] && [ "$(ls -A stable-download/teavm)" ]; then cp -r stable-download/teavm/* javascript/ 2>/dev/null || true; fi
        
        # Build dummy text placeholders if template configurations are uncommitted
        if [ ! -f "javascript/SignedBundleTemplate.txt" ]; then echo "<!-- Bundle Template -->" > javascript/SignedBundleTemplate.txt; fi
        if [ ! -f "javascript/SignedClientTemplate.txt" ]; then echo "<!-- Client Template -->" > javascript/SignedClientTemplate.txt; fi
        if [ ! -f "javascript/UpdateDownloadSources.txt" ]; then echo "[]" > javascript/UpdateDownloadSources.txt; fi

    - name: Step 3 - Compile Required Bundling Tooling
      run: |
        ./gradlew :desktopRuntime:jar || ./gradlew jar || true

    - name: Step 4 - Generate Game Offline Client
      run: |
        export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
        sh MakeSignedClient.sh || bash MakeSignedClient.sh || true

    - name: Step 5 - Isolate game HTML and Purge Java Documentation
      run: |
        # Look for the game package specifically inside the project root and bypass gradle cache directories
        if [ -f "javascript/EaglercraftX_1.8_Offline_Signed_Client.html" ]; then
          cp javascript/EaglercraftX_1.8_Offline_Signed_Client.html ./EaglercraftX_1.8_Offline_Signed_Client.html
        else
          # Fallback: Find html files while intentionally ignoring gradle's javadoc caches
          find . -type d \( -path "./build" -o -path "./.gradle" \) -prune -o -type f -name "*Offline*.html" -exec cp {} ./EaglercraftX_1.8_Offline_Signed_Client.html \; || true
        fi

    - name: Upload Clean Offline HTML Client
      uses: actions/upload-artifact@v4
      with:
        name: EaglercraftX-Offline-Client
        path: ./EaglercraftX_1.8_Offline_Signed_Client.html
        if-no-files-found: error
