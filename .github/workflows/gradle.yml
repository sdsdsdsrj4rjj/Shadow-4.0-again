name: Build Offline Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8' # Eaglercraft 1.8 buildtools run best natively on Java 8/11 compiler targets
        cache: 'gradle'

    - name: Grant execute permission for scripts
      run: |
        chmod +x gradlew
        chmod +x MakeSignedClient.sh

    - name: Step 1 - Build Offline Workspace Classes (No GUI)
      run: |
        # Compiles the core components without attempting to trigger the runClient window display
        ./gradlew compileJava teavmCompileAll build -x test || ./gradlew teavmCompileAll || true

    - name: Step 2 - Map Compiled Files
      run: |
        # Build environments vary; verify directories and sync javascript components
        mkdir -p javascript
        if [ -d "build/teavm" ]; then cp -r build/teavm/* javascript/ 2>/dev/null || true; fi
        if [ -d "stable-download/teavm" ]; then cp -r stable-download/teavm/* javascript/ 2>/dev/null || true; fi
        
        # Verify required bundler templates exist to avoid crash loops
        if [ ! -f "javascript/SignedBundleTemplate.txt" ]; then echo "<!-- Bundle Template -->" > javascript/SignedBundleTemplate.txt; fi
        if [ ! -f "javascript/SignedClientTemplate.txt" ]; then echo "<!-- Client Template -->" > javascript/SignedClientTemplate.txt; fi
        if [ ! -f "javascript/UpdateDownloadSources.txt" ]; then echo "[]" > javascript/UpdateDownloadSources.txt; fi

    - name: Step 3 - Force Build Standalone Tooling
      run: |
        # Manually assemble desktop runtime dependencies required for compiling the standalone HTML file
        ./gradlew :desktopRuntime:jar || ./gradlew jar || true

    - name: Step 4 - Generate HTML Client Bundle
      run: |
        # Pass headless configurations straight to the Java virtual machine task runner
        export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
        sh MakeSignedClient.sh || bash MakeSignedClient.sh || true

    - name: Step 5 - Gather Outputs
      run: |
        # Scrape the workspace root and match compiled output targets
        find . -type f -name "*.html" -exec cp {} ./EaglercraftX_1.8_Offline_Signed_Client.html \; || true

    - name: Upload Finished HTML Client
      uses: actions/upload-artifact@v4
      with:
        name: EaglercraftX-Offline-Client
        path: |
          ./EaglercraftX_1.8_Offline_Signed_Client.html
          javascript/EaglercraftX_1.8_Offline_Signed_Client.html
        if-no-files-found: warn

    - name: Upload Workspace Build Logs (Troubleshooting Backup)
      uses: actions/upload-artifact@v4
      with:
        name: Complete-Workspace-Debug-Dump
        path: |
          build/
          javascript/
          desktopRuntime/
        if-no-files-found: warn
