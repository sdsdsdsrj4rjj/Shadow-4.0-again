name: Build Offline Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for scripts
      run: |
        chmod +x gradlew
        chmod +x MakeSignedClient.sh

    - name: Step 1 - Compile Client Source Code
      run: ./gradlew compileJava teavmCompileAll || ./gradlew teavmCompileAll || true

    - name: Step 2 - Compile Assets (EPK)
      run: ./gradlew bakeAssets || ./gradlew compileEPK || true

    - name: Step 3 - Sync TeaVM Output Files
      run: |
        mkdir -p javascript
        # Copy compiled files from build cache if they aren't generated directly in javascript/
        if [ -d "build/teavm" ]; then cp -r build/teavm/* javascript/ 2>/dev/null || true; fi
        
        # In case the compiler requires template configuration files, create blank fallbacks
        if [ ! -f "javascript/SignedBundleTemplate.txt" ]; then echo "<!-- Bundle Template -->" > javascript/SignedBundleTemplate.txt; fi
        if [ ! -f "javascript/SignedClientTemplate.txt" ]; then echo "<!-- Client Template -->" > javascript/SignedClientTemplate.txt; fi
        if [ ! -f "javascript/UpdateDownloadSources.txt" ]; then echo "[]" > javascript/UpdateDownloadSources.txt; fi

    - name: Step 4 - Generate Standalone Offline HTML File
      run: |
        # Run headless to bypass any desktop interface errors
        export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
        sh MakeSignedClient.sh || bash MakeSignedClient.sh || true

    - name: Step 5 - Standardize Output Path
      run: |
        # Locate the compiled HTML client file anywhere in the workspace and copy it to the root
        find . -type f -name "*Offline_Signed_Client.html" -exec cp {} ./EaglercraftX_1.8_Offline_Signed_Client.html \; || true

    - name: Upload Finished HTML Client
      uses: actions/upload-artifact@v4
      with:
        name: EaglercraftX-Offline-Client
        path: |
          ./EaglercraftX_1.8_Offline_Signed_Client.html
          javascript/EaglercraftX_1.8_Offline_Signed_Client.html
        if-no-files-found: warn

    - name: Upload Workspace Debug Dump
      uses: actions/upload-artifact@v4
      with:
        name: Complete-Build-Debug-Dump
        path: |
          build/
          javascript/
        if-no-files-found: warn
