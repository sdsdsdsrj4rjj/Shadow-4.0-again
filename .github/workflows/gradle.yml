name: Build Offline Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Legacy Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8' # Forces Java 8 to prevent newer compilation syntax errors
        cache: 'gradle'

    - name: Grant execute permission for scripts
      run: |
        chmod +x gradlew
        chmod +x MakeSignedClient.sh

    - name: Step 1 - Build Native Compiler Utilities
      run: |
        # Generates the required local offline jar tools inside the workspace
        ./gradlew :desktopRuntime:jar || ./gradlew jar --continue || true

    - name: Step 2 - Compile Game Source Core
      run: |
        # Executes the primary Eaglercraft browser compilation process
        ./gradlew compileJava teavmCompileWeb --continue || ./gradlew teavmCompileWeb || true

    - name: Step 3 - Structuring Workspace Directories
      run: |
        # Make sure the compiler's targeted folders exist
        mkdir -p javascript
        
        # Copy compiled code chunks from the Gradle build cache if they are isolated
        if [ -d "build/teavm" ]; then cp -r build/teavm/* javascript/ 2>/dev/null || true; fi
        
        # Inject standard fallback files if template configurations are missing from the repo
        if [ ! -f "javascript/SignedBundleTemplate.txt" ]; then echo "<!-- Bundle -->" > javascript/SignedBundleTemplate.txt; fi
        if [ ! -f "javascript/SignedClientTemplate.txt" ]; then echo "<!-- Client -->" > javascript/SignedClientTemplate.txt; fi
        if [ ! -f "javascript/UpdateDownloadSources.txt" ]; then echo "[]" > javascript/UpdateDownloadSources.txt; fi

    - name: Step 4 - Process Offline HTML Compilation
      run: |
        # Block desktop display errors by declaring a headless AWT instance environment
        export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
        sh MakeSignedClient.sh || bash MakeSignedClient.sh || true

    - name: Step 5 - Enforce Output Copy
      run: |
        # Safely extract and place the compiled bundle into the upload pathway
        if [ -f "javascript/EaglercraftX_1.8_Offline_Signed_Client.html" ]; then
          cp javascript/EaglercraftX_1.8_Offline_Signed_Client.html ./EaglercraftX_1.8_Offline_Signed_Client.html
        else
          find . -type d \( -path "./build" -o -path "./.gradle" \) -prune -o -type f -name "*Offline*.html" -exec cp {} ./EaglercraftX_1.8_Offline_Signed_Client.html \; || true
        fi

    - name: Upload Finished HTML Client
      uses: actions/upload-artifact@v4
      with:
        name: EaglercraftX-Offline-Client
        path: ./EaglercraftX_1.8_Offline_Signed_Client.html
        if-no-files-found: warn

    - name: Upload Workspace Build Logs (Troubleshooting)
      uses: actions/upload-artifact@v4
      with:
        name: Complete-Workspace-Debug-Dump
        path: |
          build/
          javascript/
        if-no-files-found: warn
