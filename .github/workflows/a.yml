name: Build test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Compile code to javascript
        run: ./gradlew generateJavaScript

      - name: Compile assets
        run: bash ./CompileEPK.sh

      - name: Zip web files
        run: zip -r web_files.zip javascript/

      # FIX: This permanently saves your zip file for users to download
      - name: Upload offline zip download
        uses: actions/upload-artifact@v4
        with:
          name: web-files-offline
          path: web_files.zip
          retention-days: 30

      - name: Upload github-pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: javascript/

      # FIX: Condition updated to only trigger on true branch pushes
      - name: Commit changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: "pages"
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
